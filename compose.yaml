services:
  api:
    image: assan-server-store:local
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    environment:
      HTTP_PORT: "8080"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      SHUTDOWN_TIMEOUT: "10s"
      DATABASE_PATH: /data/assan.db
      SECURE_COOKIES: "${SECURE_COOKIES:-true}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
    volumes:
      - assan-data:/data
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  assan-data:
